<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Débogage Cartographie</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 4px; overflow: auto; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Débogage des fichiers cartographiques</h1>
    <div id="results"></div>

    <script>
        const resultsDiv = document.getElementById('results');
        
        // Fonction pour ajouter un message au div des résultats
        function addResult(message, isSuccess = true) {
            const div = document.createElement('div');
            div.innerHTML = `<p class="${isSuccess ? 'success' : 'error'}">${message}</p>`;
            resultsDiv.appendChild(div);
        }
        
        // Fonction pour afficher le contenu d'un fichier JSON
        function displayJSON(url, label) {
            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Erreur HTTP: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    addResult(`✅ Fichier ${label} chargé avec succès!`);
                    
                    const pre = document.createElement('pre');
                    pre.textContent = JSON.stringify(data, null, 2).substring(0, 500) + '...';
                    resultsDiv.appendChild(pre);
                })
                .catch(error => {
                    addResult(`❌ Erreur lors du chargement du fichier ${label}: ${error.message}`, false);
                });
        }
        
        // Vérifier les fichiers essentiels
        displayJSON('departements.json', 'départements');
        displayJSON('resultats_nationaux.json', 'résultats nationaux');
        displayJSON('departements_dominants.json', 'départements dominants');
        displayJSON('assets/france-departements.json', 'carte de France');
    </script>
</body>
</html>
